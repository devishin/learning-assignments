<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Товар</title>
  <style>
    body { font-family: sans-serif; margin: 32px; color: #303030; }
    h1 { color: #009ac8; }
    .row { margin: 8px 0; font-size: 18px; }
  </style>
</head>
<body>
  <h1>{{ product }}</h1>
  <div class="row"><strong>Цена:</strong> {{ price }} ₽</div>
  <div class="row"><strong>Количество:</strong> {{ qty }}</div>
  <div class="row"><strong>Сумма:</strong> {{ total }} ₽</div>
</body>
</html>
